        <div class="tweet-card">
            <h2 class="tweet-title">Tweet of the day</h2>

        <script>
            const tweetLinks = [
                "https://x.com/SplatoonJP/status/2076955865027051741",
                "https://x.com/SplatoonJP/status/2076955611796009129",
                "https://x.com/SplatoonJP/status/2075143924440793397"
            ];

            const randomTweet = tweetLinks[Math.floor(Math.random() * tweetLinks.length)];
            const tweetContainer = document.getElementById("tweet-container");

            tweetContainer.innerHTML = `
                <blockquote class="twitter-tweet" data-dnt="true" data-theme="dark">
                    <a href="${randomTweet}">View this post on X</a>
                </blockquote>
            `;

            if (!document.querySelector("script[src='https://platform.twitter.com/widgets.js']")) {
                const script = document.createElement("script");
                script.async = true;
                script.src = "https://platform.twitter.com/widgets.js";
                script.charset = "utf-8";
                document.body.appendChild(script);
            }
        </script>
